services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mtb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtb
      POSTGRES_PASSWORD: mtb_dev_password
      POSTGRES_DB: moscow_transit_bot
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
